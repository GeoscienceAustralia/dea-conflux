services:
  postgres:
    image: postgres:11.5-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=opendatacubepassword
      - POSTGRES_USER=postgres
    expose:
      - 5432
    restart: always
    # "Container Started" only means the entrypoint launched; on first boot
    # postgres still has to run initdb, and it refuses TCP connections until
    # that finishes. -h 127.0.0.1 forces a real TCP check: during initdb the
    # entrypoint runs a temporary socket-only server that would otherwise
    # report ready too early.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  conflux:
    build:
      context: .
      args:
        - ENVIRONMENT=dev
    environment:
      - DB_HOSTNAME=postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=opendatacubepassword
      - DB_DATABASE=postgres
      - AWS_DEFAULT_REGION=ap-southeast-2
      - AWS_ACCESS_KEY_ID=fake_id
      - AWS_SECRET_ACCESS_KEY=fake_key
      - AWS_NO_SIGN_REQUEST=YES
    volumes:
      - .:/code
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "-ec", "while :; do echo '.'; sleep 180 ; done"]

  index:
     image: opendatacube/datacube-index:0.1.3
     environment:
        - DB_HOSTNAME=postgres
        - DB_USERNAME=postgres
        - DB_PASSWORD=opendatacubepassword
        - DB_DATABASE=postgres
        - DB_PORT=5432
        - AWS_DEFAULT_REGION=ap-southeast-2
     depends_on:
        postgres:
          condition: service_healthy
     entrypoint: bash -c 'sleep infinity'
