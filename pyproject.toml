# pyproject.toml
[build-system]
requires = ["setuptools>=61", "wheel", "setuptools_scm[toml]>=3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "dea-conflux"
description = "A prototype tool for processing bulk polygon drills."
readme = "README.md"
license = { text = "Apache-2.0" }
# Floor set by datacube.
requires-python = ">=3.10"
# Version comes from setuptools_scm, see [tool.setuptools_scm] below.
dynamic = ["version"]
dependencies = [
    "aiohttp>=3.14.3",
    "boto3",
    "botocore",
    "click",
    "datacube",
    "fiona",
    "fsspec",
    "geopandas>=1.1.4",
    "matplotlib",
    "msgpack>=1.2.2",
    "numpy",
    "pandas",
    "pillow>=12.3.0",
    # datacube's PostgreSQL driver; required at runtime but never imported directly.
    "psycopg2-binary",
    "pyarrow",
    "python-geohash",
    "rasterio",
    "rioxarray",
    "s3fs",
    "seaborn",
    "shapely",
    "SQLAlchemy",
    "tornado>=6.5.10",
    "tqdm",
    "urllib3>=2.8.0",
    "xarray",
]

[project.optional-dependencies]
# Plain moto, not moto[all]: the suite only mocks SQS.
test = [
    "coverage",
    "cryptography>=50.0.0",
    "moto",
    "pytest",
]

[project.scripts]
dea-conflux = "dea_conflux.__main__:main"

[tool.setuptools]
packages = ["dea_conflux"]

[tool.setuptools_scm]
write_to = "dea_conflux/__version__.py"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
