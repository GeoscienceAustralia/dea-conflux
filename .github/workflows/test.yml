name: Test

on: [push]

env:
  ORG: geoscienceaustralia
  IMAGE: dea-conflux
  METADATA_CATALOG: https://raw.githubusercontent.com/GeoscienceAustralia/dea-config/a4f39b485b33608a016032d9987251881fec4b6f/workspaces/sandbox-metadata.yaml
  PRODUCT_CATALOG: https://raw.githubusercontent.com/GeoscienceAustralia/dea-config/87ca056fa62900596cbf05612da9033fc763009c/workspaces/sandbox-products.csv

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Pre-pull layers
      run: docker compose pull

    - name: Build dea-conflux image
      run: |
        docker compose build
        docker image inspect "$(docker compose config --images | grep -- '-conflux$')" --format='dea-conflux image size: {{.Size}} bytes'

    - name: Check Brotli security fix
      run: |
        IMAGE="$(docker compose config --images | grep -- '-conflux$')"
        REQUIRED="1.1.0-2ubuntu0.1"

        echo "Brotli packages installed in $IMAGE:"
        docker run --rm "$IMAGE" \
          dpkg-query -W -f='${Package} ${Version}\n' 'libbrotli*'

        INSTALLED="$(docker run --rm "$IMAGE" \
          dpkg-query -W -f='${Version}' libbrotli1)"

        echo "Installed libbrotli1: $INSTALLED"
        echo "Minimum required:      $REQUIRED"

        if ! dpkg --compare-versions "$INSTALLED" ge "$REQUIRED"; then
          echo "::error::libbrotli1 $INSTALLED is vulnerable to CVE-2026-111497"
          exit 1
        fi

        echo "libbrotli1 is patched for CVE-2026-111497"
        
    - name: Setup dea-conflux test environment
      run: |
          docker compose up -d
          ./tests/setup_test_datacube.sh
          docker compose exec -T conflux bash -c "uv sync --locked --extra test"

    - name: Run dea-conflux test
      run: |
          docker compose exec -T conflux bash -c "coverage run -m pytest ."
          docker compose exec -T conflux bash -c "coverage report -m"
          docker compose exec -T conflux bash -c "coverage xml"
          docker compose exec -T conflux bash -c "coverage html"
          docker compose down

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v2
      with:
        fail_ci_if_error: false

    - name: Clean dea-conflux image
      run: |
          (echo y) | docker container prune
          (echo y) | docker image prune

  push:
    # Only publish images that passed the tests and the Brotli check above.
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_NAME: geoscienceaustralia/dea-conflux

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version for branch build
      run: |
        git fetch --all --tags
        echo "RELEASE=$(git describe --tags)" >> $GITHUB_ENV

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        role-to-assume: arn:aws:iam::538673716275:role/dea-conflux_github-actions-role
        aws-region: ap-southeast-2

    # --no-cache stops a stale cached apt-get upgrade layer from shipping old packages.
    # The develop tag step below then reuses these fresh layers.
    - name: Push image to ECR with release tag
      uses: whoan/docker-build-with-cache-action@master
      with:
        registry: 538673716275.dkr.ecr.ap-southeast-2.amazonaws.com
        image_name: ${{ env.IMAGE_NAME }}
        image_tag: ${{ env.RELEASE }}
        build_extra_args: --no-cache --build-arg UPDATE_VERSION=${{ env.RELEASE }}

    - name: Push image to ECR with latest tag
      uses: whoan/docker-build-with-cache-action@master
      with:
        registry: 538673716275.dkr.ecr.ap-southeast-2.amazonaws.com
        image_name: ${{ env.IMAGE_NAME }}
        image_tag: develop
        build_extra_args: --build-arg UPDATE_VERSION=${{ env.RELEASE }}
